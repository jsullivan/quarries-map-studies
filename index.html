<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quarries map studies</title>
<style>
  body { margin: 0; background: #111; color: #f4f1ea; font: 16px/1.4 Georgia, serif; }
  main { max-width: 900px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-weight: normal; font-size: 28px; margin: 0 0 8px; }
  p { color: #c8c2b8; margin: 0 0 28px; }
  figure { margin: 0 0 36px; }
  img { width: 100%; height: auto; display: block; background: #222; }
  figcaption { margin-top: 8px; }
  strong { font-weight: normal; }
  span { display: block; color: #c8c2b8; font-size: 15px; }
</style>
<main>
  <h1>Five ways to print the Quarries</h1>
  <p>Style studies of the same land. Not a new survey.</p>
  <figure>
    <img src="01-the-walk.jpg" alt="The Walk">
    <figcaption><strong>1. The Walk.</strong><span>Quiet sheet. The climb is drawn along the bottom.</span></figcaption>
  </figure>
  <figure>
    <img src="02-copperplate.jpg" alt="Copperplate">
    <figcaption><strong>2. Copperplate.</strong><span>A dark wall map. The trail is the only bright color.</span></figcaption>
  </figure>
  <figure>
    <img src="03-between-the-waters.jpg" alt="Between the waters">
    <figcaption><strong>3. Between the waters.</strong><span>The creek and the river are the subject.</span></figcaption>
  </figure>
  <figure>
    <img src="04-field-card.jpg" alt="Field card">
    <figcaption><strong>4. Field card.</strong><span>Thick trail, solid water, a large scale in feet.</span></figcaption>
  </figure>
  <figure>
    <img src="05-the-plat.jpg" alt="The plat">
    <figcaption><strong>5. The plat.</strong><span>Hairline ink, drawn like a survey.</span></figcaption>
  </figure>
</main>
